<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Person - Hisab</title>

  <link rel="stylesheet" href="style.css">
</head>


<body class="person-page">

  <!-- Top Bar -->

  <header class="top-bar">

    <button id="back-btn">←</button>

    <h2 id="person-name">Person</h2>

    <button id="profile-btn"><img src="IMG_20251116_215737_558.webp" alt="Profile"></button>

  </header>


  <main>

    <!-- Current Balance -->

    <section class="person-balance">

      <p>Current Balance</p>

      <h1 id="person-balance">₹0</h1>

    </section>


    <!-- Transaction History -->

    <section class="transactions-section">

      <div class="section-heading">

        <h2>Transactions</h2>

      </div>


      <div id="transaction-list">

        <p id="no-transactions">
          No transactions yet.
        </p>

      </div>

    </section>


    <!-- Delete Person -->

    <section class="danger-zone">

      <button id="delete-person">
        Delete person
      </button>

    </section>

  </main>


  <!-- Bottom Buttons -->

  <div class="money-actions">

    <button id="add-money">
      + Add Money
    </button>

    <button id="remove-money">
      − Remove Money
    </button>

  </div>


  <!-- Money Popup -->

  <div id="money-popup">

    <div class="money-popup-box">

      <h2 id="popup-title">
        Add Money
      </h2>


      <label for="money-amount">
        Amount
      </label>

      <input
        type="number"
        id="money-amount"
        placeholder="Enter amount"
        min="0.01"
        step="0.01"
        inputmode="decimal"
      >


      <label for="money-date">
        Date
      </label>

      <input
        type="date"
        id="money-date"
      >


      <button id="save-money">
        Save
      </button>

      <button id="cancel-money">
        Cancel
      </button>

    </div>

  </div>


  <script
    type="module"
    src="person.js"
  ></script>

</body>

</html>
